[binaries]
c = ['zig', 'cc', '-target', 'x86_64-macos-none']
cpp = ['zig', 'c++', '-target', 'x86_64-macos-none']
ar = ['zig', 'ar']
ranlib = ['zig', 'ranlib']
strip = ['zig', 'strip']

[properties]needs_exe_wrapper = true

[host_machine]
system = 'darwin'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'



