[binaries]
c = ['zig', 'cc', '-target', 'arm-linux-gnueabihf']
cpp = ['zig', 'c++', '-target', 'arm-linux-gnueabihf']
ar = ['zig', 'ar']
ranlib = ['zig', 'ranlib']
strip = ['zig', 'strip']
pkg-config = 'pkg-config'

[properties]needs_exe_wrapper = true

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7'
endian = 'little'



