[binaries]
c = ['zig', 'cc', '-target', 'x86_64-linux-gnu']
cpp = ['zig', 'c++', '-target', 'x86_64-linux-gnu']
ar = ['zig', 'ar']
ranlib = ['zig', 'ranlib']
strip = ['zig', 'strip']
pkg-config = 'pkg-config'

[properties]needs_exe_wrapper = true

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'



