[binaries]
c = ['zig', 'cc', '-target', 'aarch64-macos-none']
cpp = ['zig', 'c++', '-target', 'aarch64-macos-none']
ar = ['zig', 'ar']
ranlib = ['zig', 'ranlib']
strip = ['zig', 'strip']
pkg-config = 'pkg-config'

[properties]needs_exe_wrapper = true

[host_machine]
system = 'darwin'
cpu_family = 'aarch64'
cpu = 'arm64'
endian = 'little'



